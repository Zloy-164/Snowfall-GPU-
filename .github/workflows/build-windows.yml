name: Build Snowfall GPU for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check project layout
        shell: pwsh
        run: |
          if (!(Test-Path core/src/lib.rs)) { throw "core/src/lib.rs is missing" }
          if (!(Test-Path windows/Cargo.lock)) { throw "windows/Cargo.lock is missing" }
      - name: Build Windows GPU application
        shell: pwsh
        working-directory: windows
        run: cargo build --release --locked --bin SnowfallGPU
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SnowfallGPU-Windows
          path: windows/target/release/SnowfallGPU.exe
          if-no-files-found: error

name: Build Snowfall GPU for Windows
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Place core library next to windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core | Out-Null
          Copy-Item -Path windows/core/* -Destination core -Recurse -Force
          if (!(Test-Path core/src/lib.rs)) { throw "Missing core/src/lib.rs" }
      - name: Compile locked release
        shell: pwsh
        run: |
          cd windows
          cargo build --release --locked --bin SnowfallGPU
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: SnowfallGPU-Windows
          path: windows/target/release/SnowfallGPU.exe
          if-no-files-found: error

name: Build Snowfall GPU for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check project layout
        shell: pwsh
        run: |
          if (!(Test-Path core/src/lib.rs)) { throw "core/src/lib.rs is missing" }
          if (!(Test-Path windows/Cargo.lock)) { throw "windows/Cargo.lock is missing" }
      - name: Build Windows GPU application
        shell: pwsh
        working-directory: windows
        run: cargo build --release --locked --bin SnowfallGPU
      - name: Package portable Windows build with license
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item windows/target/release/SnowfallGPU.exe dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/SnowfallGPU.exe,dist/LICENSE -DestinationPath SnowfallGPU-Windows.zip -Force
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SnowfallGPU-Windows
          path: SnowfallGPU-Windows.zip
          if-no-files-found: error
      - name: Publish public download release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Snowfall GPU for Windows 10 and Windows 11.

          Portable ZIP: extract and run SnowfallGPU.exe. No installation required.

          Based on Snowhush by Mykhailo Bezruchko.
          License: PolyForm Noncommercial 1.0.0. Copyright notice and license included in ZIP.
          Noncommercial use only. This build has not been independently security-audited.
          "@
          gh release create v1.0.0 SnowfallGPU-Windows.zip --title "Snowfall GPU v1.0.0" --notes $notes --target $env:GITHUB_SHA
